<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f2ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with gradient -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1000" cy="480" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="950" cy="100" r="60" fill="rgba(255,255,255,0.12)"/>
  <circle cx="150" cy="500" r="90" fill="rgba(255,255,255,0.06)"/>

  <!-- Main content container -->
  <g transform="translate(600, 315)">
    <!-- Logo with shadow -->
    <image href="logo.png" x="-120" y="-60" width="120" height="120" filter="url(#dropshadow)"/>

    <!-- Main text with gradient -->
    <text x="20" y="0" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#textGradient)" text-anchor="start" dominant-baseline="middle">
      herrkaefer
    </text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(255,255,255,0.1)"/>
</svg>
