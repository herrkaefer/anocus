baseURL = 'https://herrkaefer.com'
enableGitInfo = true
languageCode = 'en-us'
title = 'herrkaefer'
theme = 'hugo-paged'

[menu]
  [[menu.main]]
    name = 'Blog'
    url = '/'
    weight = 10
  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 20
  [[menu.main]]
    name = 'Subscribe'
    url = '/index.xml'
    weight = 30

[params]
  name = 'herrkaefer'
  title = 'herrkaefer'
  description = 'Personal website of herrkaefer - sharing thoughts on technology, family, and life'
  email = 'gloolar+blog@gmail.com'
  tagline = 'Personal website of herrkaefer'
  highlight_color = '#1C1C1C'
  link_color = '#00896C'
  show_disclaimer = false
  show_atom_feed = true
  show_email = true
  google_analytics_key = 'UA-3042065-2'
  toc_threshold = 999999  # 禁用目录：将阈值设置为一个很大的数字
  footer = 'Powered by [Hugo](https://gohugo.io/)'

  # SEO and Social Media
  twitter_image = '/logo.svg'
  og_image = '/logo.svg'
  author = 'herrkaefer'
  keywords = ['blog', 'technology', 'family', 'life']

  [params.logo]
    en = { alt = "herrkaefer", url = "/" }

[params.anocus]
  enabled = true
  api_base = '/api/anocus'
  turnstile_site_key = ''
  max_length = 5000
  lang = 'en'

[params.social]
  github = 'herrkaefer'
  twitter = 'herr_kaefer'
  gravatar = 'e97051c9236cbec41aaa5860ba4891fc'
  instagram = 'herrkaefer'
  weibo = 'herrkaefer'

  [params.giscus]
    repo = 'herrkaefer/blog-comments'
    repoId = 'R_kgDOQP6rYw'
    category = 'General'
    categoryId = 'DIC_kwDOQP6rY84CxeDf'
    theme = 'preferred_color_scheme'
    lang = 'en'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    style = 'github'
    lineNos = false
    lineNumbersInTable = false
    noClasses = false

[permalinks]
  posts = '/:year/:month/:day/:slug/'

[outputs]
  home = ["HTML", "RSS", "JSON", "Sitemap"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# Sitemap configuration
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[build]
  publishDir = 'public'

[pagination]
  # Number of posts per page
  pageSize = 20
