{{ if .Site.Params.anocus.enabled }}
<link rel="stylesheet" href="/anocus/anocus.css">
<div id="anocus-comments"></div>
<script src="/anocus/anocus.js" defer></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    if (!window.Anocus) return;
    window.Anocus.mount({
      container: "#anocus-comments",
      apiBase: "{{ default "/api/anocus" .Site.Params.anocus.api_base }}",
      pathname: "{{ .RelPermalink }}",
      pageTitle: {{ .Title | jsonify }},
      turnstileSiteKey: "{{ default "" .Site.Params.anocus.turnstile_site_key }}",
      maxLength: {{ default 5000 .Site.Params.anocus.max_length }},
      lang: "{{ default "en" .Site.Params.anocus.lang }}"
    });
  });
</script>
{{ else if .Site.Params.giscus }}
<script src="https://giscus.app/client.js"
        data-repo="{{ .Site.Params.giscus.repo }}"
        data-repo-id="{{ .Site.Params.giscus.repoId }}"
        data-category="{{ .Site.Params.giscus.category }}"
        data-category-id="{{ .Site.Params.giscus.categoryId }}"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="{{ default "preferred_color_scheme" .Site.Params.giscus.theme }}"
        data-lang="{{ default "en" .Site.Params.giscus.lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
{{ else }}
<!--
  To enable giscus comments, add the following to your hugo.toml:

  [params.giscus]
    repo = "herrkaefer/blog-comments"
    repoId = "YOUR_REPO_ID"
    category = "General"
    categoryId = "YOUR_CATEGORY_ID"
    theme = "preferred_color_scheme"
    lang = "en"

  Get these values from https://giscus.app after:
  1. Creating a public GitHub repo (e.g., blog-comments)
  2. Enabling Discussions in repo settings
  3. Installing the giscus app on that repo
-->
{{ end }}
