<div class="share-buttons">
  {{ $url := .Permalink | absURL }}
  {{ $title := .Title }}
  <button onclick="window.open('https://x.com/intent/post?url=' + encodeURIComponent('{{ $url }}') + '&text=' + encodeURIComponent('{{ $title }}'), '_blank', 'width=550,height=420'); return false;"
          class="share-btn share-x"
          aria-label="Share on X">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
  </button>

  <button onclick="var fbUrl = 'https://www.facebook.com/sharer.php?u=' + encodeURIComponent('{{ $url }}'); window.open(fbUrl, 'facebook-share', 'width=550,height=420,menubar=no,toolbar=no,resizable=yes,scrollbars=yes'); return false;"
          class="share-btn share-facebook"
          aria-label="Share on Facebook">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
    </svg>
  </button>

  <button onclick="var btn = this; navigator.clipboard.writeText('{{ $url }}').then(function() { var copyIcon = btn.querySelector('.copy-icon'); var checkIcon = btn.querySelector('.check-icon'); copyIcon.style.display = 'none'; checkIcon.style.display = 'block'; btn.classList.add('copied'); setTimeout(function() { copyIcon.style.display = 'block'; checkIcon.style.display = 'none'; btn.classList.remove('copied'); }, 2000); });"
          class="share-btn share-copy"
          aria-label="Copy link">
    <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: block;">
      <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
    </svg>
    <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
    </svg>
  </button>
</div>

<style>
.share-buttons {
  margin: 2rem 0;
  padding: 1rem 0;
  border-top: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.share-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: #fff;
  color: #333;
  text-decoration: none;
  transition: all 0.2s;
  cursor: pointer;
}

.share-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.share-btn svg {
  display: block;
  transition: opacity 0.2s;
}

.share-x:hover {
  background: #000;
  color: white;
  border-color: #000;
}

.share-facebook:hover {
  background: #1877f2;
  color: white;
  border-color: #1877f2;
}

.share-copy:hover {
  background: #666;
  color: white;
  border-color: #666;
}

.share-copy.copied {
  background: #10b981;
  color: white;
  border-color: #10b981;
}

.share-copy.copied:hover {
  background: #059669;
  border-color: #059669;
}

@media (prefers-color-scheme: dark) {
  .share-buttons {
    border-color: #333;
  }

  .share-btn {
    background: #2a2a2a;
    color: #ddd;
    border-color: #444;
  }

  .share-btn:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
}
</style>
